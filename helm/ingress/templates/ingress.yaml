{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: app-ingress

  annotations:
    alb.ingress.kubernetes.io/scheme: {{ .Values.ingress.scheme }}
    alb.ingress.kubernetes.io/target-type: {{ .Values.ingress.targetType }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
    - http:
        paths:

          # Backend API
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000

          # Admin frontend
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: front-admin
                port:
                  number: 80

          # User frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: front-user
                port:
                  number: 80

{{- end }}