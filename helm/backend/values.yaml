replicaCount: 1

image:
  repository: 136609826386.dkr.ecr.us-west-2.amazonaws.com/backend
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 4000

containerPort: 4000


resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 50